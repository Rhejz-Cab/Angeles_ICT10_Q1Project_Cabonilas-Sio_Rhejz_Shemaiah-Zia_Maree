<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">


   <title>SKU Generator</title>


   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


   <style>
       body {
           margin: 0;
           background: #66BD9B;
           font-family: monospace;
           min-height: 100vh;
       }


       .navbar {
           background-color: #4A332B;
       }


       .navbar-brand {
           font-weight: bold;
       }


       .nav-link {
           color:#6E4C41 !important;
           font-size: 14px;
       }


       .nav-link:hover {
           color: #66BD9B !important;
       }


       .receipt-card {
           width: 90%;
           max-width: 600px;
           margin: 45px auto;
           background: white;
           border-radius: 18px;
           overflow: hidden;
           box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
       }


       .receipt-header {
           background: linear-gradient(135deg, #6E4C41, #4A332B);
           color: white;
           text-align: center;
           padding: 28px 20px;
       }


       .receipt-header h1 {
           font-size: 28px;
           font-weight: bold;
           margin: 5px 0;
       }


       .receipt-header p {
           margin: 0;
           font-size: 13px;
       }


       .menu {
           padding: 25px;
       }


       .menu-title {
           font-size: 17px;
           font-weight: bold;
           margin-bottom: 15px;
       }


       .form-group {
           margin-bottom: 14px;
       }


       .form-group label {
           display: block;
           font-size: 13px;
           font-weight: bold;
           margin-bottom: 5px;
           color: #4A332B;
       }


       .form-group select,
       .form-group input {
           width: 100%;
           border: 1px solid #ddd;
           border-radius: 8px;
           padding: 9px 11px;
           font-family: monospace;
           box-sizing: border-box;
       }


       .order-btn {
           width: 100%;
           border: none;
           background: linear-gradient(90deg, #1f1f1f, #212021);
           color: white;
           padding: 12px;
           border-radius: 8px;
           font-weight: bold;
           margin-top: 10px;
       }


       .order-btn:hover {
           opacity: 0.9;
       }


       .summary {
           margin-top: 25px;
           border-top: 1px solid #ddd;
           padding-top: 20px;
           display: none;
       }


       .summary h3 {
           font-size: 18px;
           font-weight: bold;
       }


       .sku-item {
           display: flex;
           align-items: center;
           justify-content: space-between;
           border: 1px solid #eeeeee;
           border-radius: 8px;
           padding: 11px;
           margin-bottom: 8px;
           background: white;
       }


       .sku-item .sku-details {
           font-size: 12px;
           color: #6c757d;
       }


       .sku-code {
           font-weight: bold;
           color: #393a3c;
           font-size: 16px;
           letter-spacing: 0.5px;
       }


       footer {
           text-align: center;
           color: white;
           font-size: 12px;
           padding-bottom: 20px;
       }
   </style>
</head>


<body>


   <nav class="navbar navbar-dark">
       <div class="container">




           <a class="navbar-brand" href="#">
               ☕ Skewer
           </a>




           <div>
               <a class="nav-link d-inline-block" href="index.html">
                   🧾 Receipt Generator
               </a>




               <a class="nav-link d-inline-block" href="#">
                   🔖 SKU Generator
               </a>
           </div>


       </div>
   </nav>


   <div class="receipt-card">




       <div class="receipt-header">




           <div style="font-size: 32px;">
                𝄃𝄃𝄂𝄂
           </div>


           <h1>SKU Generator</h1>


           <p>CABONILAS & SIO</p>


       </div>


       <div class="menu">


           <div class="menu-title">
               Generate SKU
           </div>


           <div class="form-group">
               <label for="category">Product Category</label>
               <select id="category">
                   <option value="Beverage">Beverage</option>
                   <option value="Coffee">Coffee</option>
                   <option value="Pastry">Pastry</option>
                   <option value="Snack">Snack</option>
               </select>
           </div>


           <div class="form-group">
               <label for="productName">Product Name</label>
               <input
                   type="text"
                   id="productName"
                   placeholder="e.g. Bottled Water"
               >
           </div>


           <div class="form-group">
               <label for="stockQty">Stock Quantity</label>
               <input
                   type="number"
                   id="stockQty"
                   placeholder="e.g. 50"
                   min="1"
               >
           </div>


           <button
               class="order-btn"
               onclick="createSKU()"
           >
               Generate SKU
           </button>


           <div class="summary" id="summary">


               <h3>Generated SKUs</h3>


               <div id="skuItems"></div>


           </div>


       </div>


   </div>


   <footer>
   CABONILAS, RHEJZ SHEMAIAH O. / SIO, ZIA MAREE V.
   </footer>


   <script src="main.py"></script>


</body>
</html>
